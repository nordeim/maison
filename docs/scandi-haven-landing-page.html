w Arrivals",slug:"new-arrivals",description:"The latest additions to our collection",image:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=800&q=80",heroImage:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=1920&q=80"},{id:"gifts",name:"Curated Gifts",slug:"gifts",description:"Thoughtfully selected pieces for giving",image:"https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?w=800&q=80",heroImage:"https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?w=1920&q=80"}],ws=[{id:"arc-pendant",name:"Arc Pendant Light",slug:"arc-pendant-light",collection:"lighting",price:485,description:"A graceful arc of hand-bent brass and linen",longDescription:"The Arc Pendant embodies the quiet elegance of Scandinavian design. Each piece is hand-bent by our workshop artisans, creating subtle variations that make every light unique. The natural linen shade diffuses light softly, casting a warm glow that transforms any space into a sanctuary.",materials:"Solid brass, natural Belgian linen",dimensions:"45cm diameter × 30cm height",images:["https://images.unsplash.com/photo-1524484485831-a92ffc0de03f?w=800&q=80","https://images.unsplash.com/photo-1540932239986-30128078f3c5?w=800&q=80"],featured:!0},{id:"orb-table-lamp",name:"Orb Table Lamp",slug:"orb-table-lamp",collection:"lighting",price:295,description:"Mouth-blown glass meets sculptural bronze",longDescription:"Our Orb Table Lamp pairs the organic beauty of mouth-blown glass with a solid bronze base. The glass sphere captures and refracts light, while the weighted base provides perfect balance. A statement piece that works as beautifully switched off as it does illuminated.",materials:"Mouth-blown glass, solid bronze",dimensions:"25cm diameter × 40cm height",images:["https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?w=800&q=80","https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=800&q=80"],new:!0},{id:"vessel-collection",name:"Large Sculptural Vessel",slug:"large-sculptural-vessel",collection:"ceramics",price:320,description:"Hand-thrown stoneware with natural ash glaze",longDescription:"Each vessel in this collection is hand-thrown on the wheel and fired in our wood-burning kiln. The natural ash glaze creates unrepeatable patterns—from soft dove grey to deep iron brown. These vessels are meant to be touched, to show the maker's hand in every curve.",materials:"High-fire stoneware, natural ash glaze",dimensions:"35cm height × 22cm diameter",images:["https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=800&q=80","https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?w=800&q=80"],featured:!0},{id:"serving-bowl",name:"Everyday Serving Bowl",slug:"everyday-serving-bowl",collection:"ceramics",price:145,description:"Simple forms for daily rituals",longDescription:"The Everyday Bowl is designed for the rituals that anchor our days—morning fruit, evening salads, gathered bread. Its generous proportions and gentle curve invite gathering around the table. Each bowl is glazed in our signature cream, revealing flecks of iron from the clay body.",materials:"Stoneware, food-safe glaze",dimensions:"28cm diameter × 10cm height",images:["https://images.unsplash.com/photo-1610701596007-11502861dcfa?w=800&q=80","https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=800&q=80"]},{id:"oak-dining-table",name:"Harvest Dining Table",slug:"harvest-dining-table",collection:"furniture",price:2850,description:"Solid oak crafted for generations of gathering",longDescription:"The Harvest Table is built to become the heart of your home. Crafted from single-slab white oak, its live edges preserve the natural character of the wood. Traditional mortise-and-tenon joinery ensures this table will be passed down through generations. Each table is unique, bearing the grain patterns and subtle color variations that only solid wood can offer.",materials:"Solid white oak, natural oil finish",dimensions:"220cm length × 95cm width × 76cm height",images:["https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=800&q=80","https://images.unsplash.com/photo-1506439773649-6e0eb8cfb237?w=800&q=80"],featured:!0},{id:"woven-lounge-chair",name:"Woven Lounge Chair",slug:"woven-lounge-chair",collection:"furniture",price:1450,description:"Danish paper cord meets sculptural walnut",longDescription:"Our Lounge Chair reimagines the classic Danish cord technique for contemporary comfort. The seat and back are hand-woven with natural paper cord over a sculptural walnut frame. The result is a chair that's as beautiful from behind as from the front—a piece that commands attention from every angle.",materials:"Solid walnut, natural paper cord",dimensions:"75cm width × 80cm depth × 85cm height",images:["https://images.unsplash.com/photo-1598300042247-d088f8ab3a91?w=800&q=80","https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=800&q=80"],new:!0},{id:"linen-throw",name:"Heritage Linen Throw",slug:"heritage-linen-throw",collection:"textiles",price:195,description:"Stonewashed Belgian linen in natural tones",longDescription:"Woven from Belgian flax and stonewashed for softness, our Heritage Throw brings effortless warmth to any room. The natural fiber breathes with the seasons—cool in summer, warming in winter. With each wash, the linen grows softer, developing a gentle drape that improves with time.",materials:"100% Belgian linen",dimensions:"180cm × 140cm",images:["https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=800&q=80","https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=800&q=80"]},{id:"wool-cushion",name:"Hand-Felted Wool Cushion",slug:"hand-felted-wool-cushion",collection:"textiles",price:165,description:"Artisan-made using traditional felting techniques",longDescription:"Each cushion begins as raw wool, carefully felted by hand using techniques passed down through generations. The resulting textile is dense yet soft, with a depth of texture that cannot be replicated by machine. Available in a palette of natural earth tones.",materials:"100% New Zealand wool, linen back",dimensions:"50cm × 50cm",images:["https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=800&q=80","https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=800&q=80"]},{id:"sculptural-vase",name:"Sculptural Bud Vase",slug:"sculptural-bud-vase",collection:"objects",price:85,description:"Minimalist form for a single stem",longDescription:"The Bud Vase celebrates restraint—one stem, one bloom, one moment of beauty. Hand-thrown from local clay and finished with our matte white glaze, its gentle curves create elegant shadows that shift with the day's light. Perfect alone or grouped in threes.",materials:"Stoneware, matte white glaze",dimensions:"15cm height × 6cm diameter",images:["https://images.unsplash.com/photo-1578500494198-246f612d3b3d?w=800&q=80","https://images.unsplash.com/photo-1603006905003-be475563bc59?w=800&q=80"]},{id:"brass-candleholder",name:"Forge Candleholder Set",slug:"forge-candleholder-set",collection:"objects",price:245,description:"Hand-forged brass in three graduating heights",longDescription:"Our Forge Candleholders are shaped by fire, each one hand-forged from solid brass rod. The set of three graduating heights creates a sculptural tableau, their surfaces bearing the subtle marks of the blacksmith's hammer. Over time, the brass develops a rich patina that deepens their beauty.",materials:"Solid forged brass",dimensions:"15cm, 20cm, 25cm heights",images:["https://images.unsplash.com/photo-1603006905003-be475563bc59?w=800&q=80","https://images.unsplash.com/photo-1578500494198-246f612d3b3d?w=800&q=80"],featured:!0},{id:"winter-candle",name:"Winter Hearth Candle",slug:"winter-hearth-candle",collection:"seasonal",price:65,description:"Notes of cedar, smoke, and dried herbs",longDescription:"Our Winter Hearth Candle captures the essence of the coldest months—the quiet of snow-covered mornings and the warmth of a well-tended fire. Hand-poured from natural soy wax and housed in our signature reusable stoneware vessel.",materials:"Natural soy wax, cotton wick, stoneware vessel",dimensions:"80 hour burn time",images:["https://images.unsplash.com/photo-1602028915047-37269d1a73f7?w=800&q=80","https://images.unsplash.com/photo-1603006905003-be475563bc59?w=800&q=80"]},{id:"marble-tray",name:"Honed Marble Tray",slug:"honed-marble-tray",collection:"new",price:175,description:"Natural stone for everyday beauty",longDescription:"Cut from a single block of Carrara marble and honed to a soft matte finish, this tray elevates everyday objects into a curated vignette. Its natural veining ensures each tray is one of a kind. Use it to corral bathroom essentials, display treasured objects, or serve aperitifs.",materials:"Carrara marble",dimensions:"30cm × 20cm × 2cm",images:["https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=800&q=80","https://images.unsplash.com/photo-1578500494198-246f612d3b3d?w=800&q=80"],new:!0},{id:"gift-box",name:"Curated Gift Box",slug:"curated-gift-box",collection:"gifts",price:225,description:"A thoughtful selection of our favorite pieces",longDescription:"Our Curated Gift Box brings together a selection of our most-loved small pieces: a bud vase, a hand-poured candle, and a set of linen napkins. Presented in a reusable wooden box lined with tissue paper, it's a gift that speaks of intention and care.",materials:"Stoneware, soy candle, linen, wooden box",images:["https://images.unsplash.com/photo-1549488344-1f9b8d2bd1f3?w=800&q=80","https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?w=800&q=80"]}],AL=()=>ws.filter(e=>e.new),ML=e=>ws.find(t=>t.slug===e),IL=e=>xn.find(t=>t.slug===e),DL=(e,t=4)=>{const n=ws.find(r=>r.id===e);return n?ws.filter(r=>r.collection===n.collection&&r.id!==e).slice(0,t):[]};var LL=m.createContext(void 0);function jS(e){const t=m.useContext(LL);return e||t||"ltr"}function RS(e){const t=m.useRef({value:e,previous:e});return m.useMemo(()=>(t.current.value!==e&&
