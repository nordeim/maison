name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Audit (high/critical CVEs only)
        run: pnpm audit --audit-level=high
        continue-on-error: true # Non-blocking in Phase 0

      - name: Build
        run: pnpm build
        env:
          # Build-context placeholders (per @maison/config env.ts fallback)
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder
          DATABASE_URL_UNPOOLED: postgresql://placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: placeholder-secret-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SANITY_PROJECT_ID: placeholder
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_POSTHOG_KEY: placeholder
          NEXT_PUBLIC_CLOUDFLARE_IMAGES_URL: https://placeholder.com

  e2e:
    name: E2E Tests
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder
          DATABASE_URL_UNPOOLED: postgresql://placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: placeholder-secret-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SANITY_PROJECT_ID: placeholder
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_POSTHOG_KEY: placeholder
          NEXT_PUBLIC_CLOUDFLARE_IMAGES_URL: https://placeholder.com

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
